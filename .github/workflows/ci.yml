name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
      - name: Install c2patool
        run: |
          curl -sSL -o /tmp/c2patool.tar.gz https://github.com/contentauth/c2patool/releases/download/v0.28.0/v0.28.0-x86_64-unknown-linux-gnu.tar.gz
          sudo tar -xzf /tmp/c2patool.tar.gz -C /usr/local/bin --strip-components=1 c2patool/c2patool
          c2patool --version
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest -q
        env:
          VERIXA_ENVIRONMENT: test
      - name: Migrations apply cleanly and match models
        run: |
          alembic upgrade head
          alembic check
        env:
          VERIXA_ENVIRONMENT: test
          VERIXA_DATA_DIR: ${{ runner.temp }}/verixa

  web:
    name: Web (lint, type, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
      - name: Install c2patool
        run: |
          curl -sSL -o /tmp/c2patool.tar.gz https://github.com/contentauth/c2patool/releases/download/v0.28.0/v0.28.0-x86_64-unknown-linux-gnu.tar.gz
          sudo tar -xzf /tmp/c2patool.tar.gz -C /usr/local/bin --strip-components=1 c2patool/c2patool
          c2patool --version
      - name: Install the API into the venv the Playwright config expects
        working-directory: services/api
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        env:
          CI: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    name: Container images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          load: true
          tags: verixa-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: verixa-web:ci
          build-args: NEXT_PUBLIC_API_BASE_URL=https://app.example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Preflight refuses a non-deployable production configuration
        run: |
          set +e
          docker run --rm -e VERIXA_ENVIRONMENT=production -e VERIXA_SECRET_KEY=ci-only-secret-key-with-32-plus-characters verixa-api:ci python -m app.preflight
          test $? -eq 1
      - name: API image starts and answers liveness
        run: |
          docker run -d --name api -p 8000:8000 -e VERIXA_ENVIRONMENT=development verixa-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health/live && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/v1/health/live
          docker logs api | tail -20
          docker rm -f api
      - name: Web image starts and serves the landing page
        run: |
          docker run -d --name web -p 3000:3000 -e API_BASE_URL=http://127.0.0.1:8000 verixa-web:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          docker rm -f web
