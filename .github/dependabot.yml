version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
  - package-ecosystem: pip
    directory: /services/api
    schedule: { interval: weekly }
    groups:
      pip-minor: { update-types: [minor, patch] }
